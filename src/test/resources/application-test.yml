# 单测不启 springdoc UI，避免无关 WARN；网关本机文档见主 application.yml
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
