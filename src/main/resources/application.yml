server:
  port: 8090
  # 便于经 X-Forwarded-* / Forwarded 还原对外 URL；部分 springdoc 场景下可辅助识别前缀（与下游微服务一致）
  forward-headers-strategy: framework

peach:
  gateway:
    # 路由排查 JSON：GET http://网关:8090/routes（匿名，见动态白名单配置）
    discovery:
      # RouteListWatcher：比对注册中心服务列表变更并 RefreshRoutes（毫秒）
      route-watch-interval-ms: ${PEACH_GATEWAY_ROUTE_WATCH_INTERVAL_MS:10000}

spring:
  data:
    redis:
      host: ${REDIS_HOST:192.168.99.100}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  application:
    name: peach-gateway
    # 四位模块前缀，与业务服务一致，供网关 11 位 code 拼装（见 GatewayApiResultCodeComposer）；网关不做业务末四位区间校验
    module-code: GWAY
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.99.100:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:dev}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_REGISTER_IP:}
        port: ${NACOS_REGISTER_PORT:${server.port}}
        fail-fast: false
    gateway:
      server:
        webflux:
          # 跨域由 GatewayCorsWebFilterConfiguration（CorsWebFilter）+ peach.gateway.cors 统一处理；
          # 若改回仅 yml 配置，须使用本节点 globalcors（勿用已废弃的 spring.cloud.gateway.globalcors）
          discovery:
            locator:
              # 关闭自动 RouteDefinitionLocator，改用手工 DiscoveryClient 动态路由（见 route.discovery 包）
              enabled: false
management:
  health:
    discovery:
      enabled: true
# Swagger 文档门户：peach.swagger.enabled；HTML 另受 peach.swagger.html-enabled 与 prod/product/produce profile 默认关闭规则约束
# 文档门户：GET /peach-doc-portal/services、/index.html（不经 /peach-gateway 前缀）
# 其它经网关访问：/peach-gateway/{serviceId}/... ；本网关 springdoc：/peach-gateway/swagger-ui.html
# 各微服务可在 server.description 配置说明（写入 Nacos 实例元数据键 server.description）；需 server.forward-headers-strategy: framework
